name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - name: Fontları indir (PDF testleri için)
        run: npm run setup
      - name: Birim testleri (SMT motoru)
        run: node --test
      - name: Tarayıcı paketini üret (src/mt -> egit.html)
        run: npm run build:web
      - name: Tarayıcı modülleri sözdizimi denetimi
        run: node scripts/check-html.mjs
